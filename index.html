<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewHub — Aggregated reviews, across everything</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="hub-wrap">
  <div class="hub-header">
    <h1 class="hub-title">ReviewHub</h1>
    <p class="hub-tagline">Aggregated reviews, across everything.</p>
  </div>

  <div class="hub-grid">
    <a class="hub-tile active" href="movies/index.html">
      <div class="hub-icon active-icon">
        <svg width="26" height="26" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="18" stroke="white" stroke-width="1.6"/>
          <circle cx="24" cy="24" r="11" stroke="white" stroke-width="1.6"/>
          <circle cx="24" cy="24" r="4" stroke="white" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="hub-name">Movies</div>
      <div class="hub-desc">Aggregated YouTube reviews, verdicts, and ratings for new releases.</div>
    </a>

    <div class="hub-tile disabled">
      <div class="hub-icon muted-icon">
        <svg width="24" height="24" viewBox="0 0 48 48" fill="none">
          <path d="M8 28L11 18C11.6 16 13.4 14.7 15.5 14.7H32.5C34.6 14.7 36.4 16 37 18L40 28" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="6" y="28" width="36" height="9" rx="3" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="14" cy="37" r="3" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="34" cy="37" r="3" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="hub-name">Cars</div>
      <div class="hub-desc">Aggregated reviews for new car launches.</div>
      <span class="hub-badge">Coming soon</span>
    </div>

    <div class="hub-tile disabled">
      <div class="hub-icon muted-icon">
        <svg width="24" height="24" viewBox="0 0 48 48" fill="none">
          <path d="M7 33L18 22L25 29L41 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M31 13H41V23" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="hub-name">Stocks</div>
      <div class="hub-desc">Aggregated analyst and creator takes on market moves.</div>
      <span class="hub-badge">Coming soon</span>
    </div>
  </div>

  <div class="hub-footer">
    <a class="top-admin-link" href="admin-login.html">Admin</a>
  </div>
</div>

</body>
</html>
