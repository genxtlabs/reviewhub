<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewHub Admin — Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card card-box">
    <div style="display:flex; align-items:baseline; gap:12px; margin-bottom:4px;">
      <span class="wordmark">ReviewHub</span>
    </div>
    <div class="admin-badge" style="width:fit-content; margin-bottom:24px;">Admin</div>

    <div id="error-box"></div>

    <form id="login-form">
      <div class="form-field">
        <label class="field-label">Username</label>
        <input class="input" id="username" type="text" autocomplete="username" autofocus>
      </div>
      <div class="form-field" style="margin-bottom:24px;">
        <label class="field-label">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Sign in</button>
    </form>

    <div class="login-hint">
      Prototype only — no real backend or account system.<br>
      Demo credentials: <strong>admin</strong> / <strong>reviewhub2026</strong>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="store.js"></script>
<script>
  const ADMIN_USER = 'admin';
  const ADMIN_PASS = 'reviewhub2026';

  if (isLoggedIn()) location.href = 'admin.html';

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
      login();
      location.href = 'admin.html';
    } else {
      document.getElementById('error-box').innerHTML = `<div class="login-error">Incorrect username or password.</div>`;
    }
  });
</script>
</body>
</html>
