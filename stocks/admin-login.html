<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>ReviewHub Stocks Admin — Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card card-box">
    <div style="display:flex; align-items:baseline; gap:12px; margin-bottom:4px;">
      <span class="wordmark">ReviewHub</span>
    </div>
    <div class="admin-badge" style="width:fit-content; margin-bottom:24px;">Stocks Admin</div>

    <div id="error-box"></div>

    <form id="login-form">
      <div class="form-field">
        <label class="field-label">Email</label>
        <input class="input" id="email" type="email" autocomplete="username" autofocus>
      </div>
      <div class="form-field" style="margin-bottom:24px;">
        <label class="field-label">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Sign in</button>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script>
  if (localStorage.getItem('stockpulse_admin_token')) location.href = 'admin.html';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('error-box');
    errorBox.innerHTML = '';

    try {
      const res = await fetch(`${STOCKS_API_BASE}/api/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      if (!res.ok) throw new Error('Invalid credentials');
      const { token } = await res.json();
      localStorage.setItem('stockpulse_admin_token', token);
      location.href = 'admin.html';
    } catch (err) {
      errorBox.innerHTML = `<div class="login-error">Incorrect email or password.</div>`;
    }
  });
</script>
</body>
</html>
