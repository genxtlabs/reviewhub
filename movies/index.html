<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>ReviewHub — Movie release aggregator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="vhero" id="movies-vhero" style="--vaccent:#a78bfa; background-image:url('../assets/movies-hero.jpg');">
  <div class="vhero-nav">
    <a href="../index.html" class="wordmark" style="color:inherit;">ReviewHub</a>
    <div style="display:flex; align-items:center; gap:18px;">
      <a href="best-rated.html" class="top-admin-link">Best Rated</a>
      <a class="top-admin-link" href="../admin-login.html">Admin</a>
    </div>
  </div>
  <div class="vhero-content">
    <div class="vhero-eyebrow" style="color:var(--vaccent);">Movies</div>
    <h1 class="vhero-title">Watch <span class="accent">Smarter.</span></h1>
    <p class="vhero-sub">Aggregated YouTube reviews, verdicts, and ratings for every new release.</p>
  </div>
</div>

<div class="wrap">
  <div class="filter-row" style="padding-top:28px;">
    <input type="text" id="search-input" class="search-input" placeholder="Search movies by title&hellip;" autocomplete="off">
  </div>

  <div class="filter-row" style="padding-top:16px;">
    <span class="filter-label">Language</span>
    <div class="chip-row" id="lang-filter"></div>
  </div>

  <div class="filter-row" style="padding-top:14px;">
    <span class="filter-label">Industry</span>
    <div class="chip-row" id="industry-filter"></div>
  </div>

  <div class="filter-row" style="padding-top:14px;">
    <span class="filter-label">Sort by</span>
    <div class="chip-row" id="sort-filter"></div>
  </div>

  <div class="section-heading">
    <h1>This week&rsquo;s releases</h1>
    <span class="muted" id="results-label"></span>
  </div>

  <div class="grid" id="movie-grid"></div>
</div>

<script src="../data.js"></script>
<script src="../store.js"></script>
<script>
  let filterLang = 'All';
  let filterIndustry = 'All';
  let searchQuery = '';
  let sortBy = 'newest';
  const SORT_OPTIONS = [
    { key: 'newest', label: 'Newest' },
    { key: 'score', label: 'Highest Rated' },
  ];

  function renderFilters() {
    const langs = ['All', ...getLanguages()];
    const langEl = document.getElementById('lang-filter');
    langEl.innerHTML = '';
    langs.forEach((lang) => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (lang === filterLang ? ' active' : '');
      chip.textContent = lang;
      chip.onclick = () => { filterLang = lang; render(); };
      langEl.appendChild(chip);
    });

    const industries = ['All', ...Array.from(new Set(getPublishedMovies().map((m) => m.industry))).sort()];
    const indEl = document.getElementById('industry-filter');
    indEl.innerHTML = '';
    industries.forEach((ind) => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (ind === filterIndustry ? ' active' : '');
      chip.textContent = ind;
      chip.onclick = () => { filterIndustry = ind; render(); };
      indEl.appendChild(chip);
    });

    const sortEl = document.getElementById('sort-filter');
    sortEl.innerHTML = '';
    SORT_OPTIONS.forEach((opt) => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (opt.key === sortBy ? ' active' : '');
      chip.textContent = opt.label;
      chip.onclick = () => { sortBy = opt.key; render(); };
      sortEl.appendChild(chip);
    });
  }

  function posterMarkup(movie) {
    const imgSrc = movie.posterImage || movie.posterUrl;
    if (imgSrc) {
      return `
        <div class="poster">
          <img src="${imgSrc}" alt="" style="width:100%; height:100%; object-fit:cover;" loading="lazy">
          <span class="lang-tag">${movie.language}</span>
        </div>`;
    }
    return `
      <div class="poster" style="background:${movie.posterGrad}">
        <svg viewBox="0 0 200 300">
          <circle cx="100" cy="130" r="70" fill="none" stroke="#ffffff" stroke-width="1"></circle>
          <circle cx="100" cy="130" r="46" fill="none" stroke="#ffffff" stroke-width="1"></circle>
          <circle cx="100" cy="130" r="22" fill="none" stroke="#ffffff" stroke-width="1"></circle>
        </svg>
        <span class="initial">${movie.title.charAt(0)}</span>
        <span class="lang-tag">${movie.language}</span>
      </div>`;
  }

  const MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
  function parseReleaseDate(str) {
    const [day, mon, year] = (str || '').split(' ');
    return new Date(Number(year), MONTHS[mon] ?? 0, Number(day));
  }

  function renderGrid() {
    const grid = document.getElementById('movie-grid');
    const allMovies = getPublishedMovies();
    let list = allMovies;
    if (filterLang !== 'All') list = list.filter((m) => m.language === filterLang);
    if (filterIndustry !== 'All') list = list.filter((m) => m.industry === filterIndustry);
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      list = list.filter((m) => m.title.toLowerCase().includes(q));
    }
    list = list.slice().sort((a, b) => {
      if (sortBy === 'score') return b.score - a.score;
      return parseReleaseDate(b.releaseDate) - parseReleaseDate(a.releaseDate);
    });
    document.getElementById('results-label').textContent = `${list.length} of ${allMovies.length} releases`;

    grid.innerHTML = list.map((m) => {
      const v = VERDICTS[m.verdictKey];
      return `
        <div class="card" onclick="location.href='movie.html?id=${m.id}'">
          ${posterMarkup(m)}
          <div>
            <div class="card-title">${m.title}</div>
            <div class="card-meta">${m.industry} &middot; ${m.releaseDate}</div>
            <div class="score-row">
              <span><span class="score">${m.score}</span><span class="score-suffix">/10</span></span>
              <span class="muted">${m.reviewCount} reviews</span>
            </div>
            <div class="verdict-row">
              <span class="dot" style="background:${v.color}"></span>
              <span class="verdict-label">${v.label}</span>
            </div>
          </div>
        </div>`;
    }).join('') || `<div class="empty-state" style="grid-column:1 / -1;">No published movies match this filter yet.</div>`;
  }

  function applyCustomHero() {
    const custom = getHeroImage('movies');
    if (custom) {
      document.getElementById('movies-vhero').style.backgroundImage = `url('${custom}')`;
    }
  }

  function render() {
    applyCustomHero();
    renderFilters();
    renderGrid();
  }

  document.getElementById('search-input').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderGrid();
  });

  render();
</script>
</body>
</html>
