<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>ReviewHub — Best Rated Movies</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="header-top">
      <div style="display:flex; align-items:baseline; gap:14px;">
        <a href="../index.html" class="wordmark" style="color:inherit;">ReviewHub</a>
        <span class="tagline">Movies &middot; Reviews, aggregated.</span>
      </div>
    </div>
    <a class="back-link" href="index.html">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      All movies
    </a>
    <div class="rule"></div>
  </div>

  <div class="section-heading">
    <h1>Best Rated</h1>
    <span class="muted" id="results-label"></span>
  </div>

  <div class="filter-row" style="padding-bottom:20px;">
    <span class="filter-label">Language</span>
    <div class="chip-row" id="lang-filter"></div>
  </div>

  <div class="leaderboard" id="leaderboard-list"></div>
</div>

<script src="../data.js"></script>
<script src="../store.js"></script>
<script>
  let filterLang = 'All';

  function renderFilters() {
    const langs = ['All', ...getLanguages()];
    const el = document.getElementById('lang-filter');
    el.innerHTML = '';
    langs.forEach((lang) => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (lang === filterLang ? ' active' : '');
      chip.textContent = lang;
      chip.onclick = () => { filterLang = lang; render(); };
      el.appendChild(chip);
    });
  }

  function posterMarkup(movie) {
    const imgSrc = movie.posterImage || movie.posterUrl;
    if (imgSrc) {
      return `<div class="lb-poster"><img src="${imgSrc}" alt="" style="width:100%; height:100%; object-fit:cover;" loading="lazy"></div>`;
    }
    return `<div class="lb-poster" style="background:${movie.posterGrad}; display:flex; align-items:center; justify-content:center;">
      <span style="font-family:'Fraunces',serif; font-size:28px; color:rgba(255,255,255,0.9);">${movie.title.charAt(0)}</span>
    </div>`;
  }

  function render() {
    renderFilters();
    const allMovies = getPublishedMovies();
    const list = (filterLang === 'All' ? allMovies : allMovies.filter((m) => m.language === filterLang))
      .slice()
      .sort((a, b) => b.score - a.score);

    document.getElementById('results-label').textContent = `${list.length} of ${allMovies.length} releases, ranked by score`;

    const container = document.getElementById('leaderboard-list');
    container.innerHTML = list.map((m, i) => {
      const v = VERDICTS[m.verdictKey];
      return `
        <div class="leaderboard-row" onclick="location.href='movie.html?id=${m.id}'">
          <div class="leaderboard-rank">${i + 1}</div>
          ${posterMarkup(m)}
          <div class="leaderboard-info">
            <div class="card-title">${m.title}</div>
            <div class="card-meta">${m.industry} &middot; ${m.language} &middot; ${m.releaseDate}</div>
          </div>
          <div class="leaderboard-score">
            <span class="score">${m.score}</span><span class="score-suffix">/10</span>
          </div>
          <div class="verdict-row" style="margin-top:0;">
            <span class="dot" style="background:${v.color}"></span>
            <span class="verdict-label">${v.label}</span>
          </div>
          <div class="muted" style="min-width:80px; text-align:right;">${m.reviewCount} reviews</div>
        </div>`;
    }).join('') || `<div class="empty-state">No published movies match this filter yet.</div>`;
  }

  render();
</script>
</body>
</html>
