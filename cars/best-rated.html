<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>ReviewHub — Best Rated Cars</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="header-top">
      <div style="display:flex; align-items:baseline; gap:14px;">
        <a href="../index.html" class="wordmark" style="color:inherit;">ReviewHub</a>
        <span class="tagline">Cars &middot; Reviews, aggregated.</span>
      </div>
    </div>
    <a class="back-link" href="index.html">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      All cars
    </a>
    <div class="rule"></div>
  </div>

  <div class="section-heading">
    <h1>Best Rated</h1>
    <span class="muted" id="results-label"></span>
  </div>

  <div class="filter-row" style="padding-bottom:20px;">
    <span class="filter-label">Brand</span>
    <div class="chip-row" id="brand-filter"></div>
  </div>

  <div class="leaderboard" id="leaderboard-list"></div>
</div>

<script src="../data.js"></script>
<script src="../store.js"></script>
<script>
  let filterBrand = 'All';

  function renderFilters() {
    const brands = ['All', ...Array.from(new Set(getPublishedCars().map((c) => c.brand))).sort()];
    const el = document.getElementById('brand-filter');
    el.innerHTML = '';
    brands.forEach((b) => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (b === filterBrand ? ' active' : '');
      chip.textContent = b;
      chip.onclick = () => { filterBrand = b; render(); };
      el.appendChild(chip);
    });
  }

  function posterMarkup(car) {
    const imgSrc = car.posterImage || car.posterUrl;
    if (imgSrc) {
      return `<div class="lb-poster"><img src="${imgSrc}" alt="" style="width:100%; height:100%; object-fit:cover;" loading="lazy"></div>`;
    }
    return `<div class="lb-poster" style="background:${car.posterGrad}; display:flex; align-items:center; justify-content:center;">
      <span style="font-family:'Fraunces',serif; font-size:28px; color:rgba(255,255,255,0.9);">${car.title.charAt(0)}</span>
    </div>`;
  }

  function render() {
    renderFilters();
    const allCars = getPublishedCars();
    const list = (filterBrand === 'All' ? allCars : allCars.filter((c) => c.brand === filterBrand))
      .slice()
      .sort((a, b) => b.score - a.score);

    document.getElementById('results-label').textContent = `${list.length} of ${allCars.length} cars, ranked by score`;

    const container = document.getElementById('leaderboard-list');
    container.innerHTML = list.map((c, i) => {
      const v = CAR_VERDICTS[c.verdictKey];
      return `
        <div class="leaderboard-row" onclick="location.href='car.html?id=${c.id}'">
          <div class="leaderboard-rank">${i + 1}</div>
          ${posterMarkup(c)}
          <div class="leaderboard-info">
            <div class="card-title">${c.title}</div>
            <div class="card-meta">${c.brand} &middot; ${c.fuelType} &middot; ${c.priceRange}</div>
          </div>
          <div class="leaderboard-score">
            <span class="score">${c.score}</span><span class="score-suffix">/10</span>
          </div>
          <div class="verdict-row" style="margin-top:0;">
            <span class="dot" style="background:${v.color}"></span>
            <span class="verdict-label">${v.label}</span>
          </div>
          <div class="muted" style="min-width:80px; text-align:right;">${c.reviewCount} reviews</div>
        </div>`;
    }).join('') || `<div class="empty-state">No published cars match this filter yet.</div>`;
  }

  render();
</script>
</body>
</html>
