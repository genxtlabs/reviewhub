<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>ReviewHub — Car detail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="header-top">
      <div style="display:flex; align-items:baseline; gap:14px;">
        <a href="../index.html" class="wordmark" style="color:inherit;">ReviewHub</a>
        <span class="tagline">Cars &middot; Reviews, aggregated.</span>
      </div>
    </div>
    <a class="back-link" href="index.html">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      All cars
    </a>
    <div class="rule"></div>
  </div>

  <div id="content"></div>
</div>

<script src="../data.js"></script>
<script src="../store.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const requested = getCar(params.get('id'));

  if (!requested || requested.status !== 'published') {
    document.getElementById('content').innerHTML = `<div class="empty-state">This car isn't published yet. <a href="index.html">Back to all cars</a></div>`;
    throw new Error('car not published');
  }

  const car = requested;
  const v = CAR_VERDICTS[car.verdictKey];
  const videos = (car.videos || []).filter((x) => x.verdictKey);

  const VIDEO_LANGS = ['All', ...Array.from(new Set(videos.map((x) => x.language)))];
  let filterLang = 'All';

  function checkIcon() {
    return `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  function crossIcon() {
    return `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4L12 12M12 4L4 12" stroke="#f87171" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  }
  function playIcon() {
    return `<svg width="13" height="13" viewBox="0 0 16 16" fill="#0d0b0a"><path d="M4 2.5L13 8L4 13.5V2.5Z"/></svg>`;
  }
  function docIcon() {
    return `<svg width="20" height="20" viewBox="0 0 16 16" fill="none"><path d="M4 1.5H9.5L12.5 4.5V14.5H4V1.5Z" stroke="#0d0b0a" stroke-width="1.3" stroke-linejoin="round"/><path d="M6 8H10.5M6 10.5H10.5" stroke="#0d0b0a" stroke-width="1.3" stroke-linecap="round"/></svg>`;
  }
  function externalIcon() {
    return `<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M4 12L12 4M12 4H5M12 4V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function counts(list) {
    const positive = list.filter((x) => x.verdictKey === 'must' || x.verdictKey === 'good').length;
    const mixed = list.filter((x) => x.verdictKey === 'onetime').length;
    const negative = list.filter((x) => x.verdictKey === 'wait' || x.verdictKey === 'skip').length;
    return { positive, mixed, negative, total: list.length };
  }

  function aspectLabel(key) {
    const found = CAR_ASPECTS.find((a) => a.key === key);
    if (!found) return key;
    if (key === 'efficiency' && car.fuelType === 'Electric') return 'EV Range';
    return found.label;
  }

  function renderAspects() {
    const scores = car.aspectScores || {};
    const keys = CAR_ASPECTS.map((a) => a.key).filter((k) => scores[k] != null);
    if (!keys.length) return '';
    return `
      <div class="summary-card" style="margin-top:24px;">
        <span class="filter-label">Rated by Aspect</span>
        <div class="aspect-grid">
          ${keys.map((k) => `
            <div class="aspect-row">
              <span class="aspect-label">${aspectLabel(k)}</span>
              <div class="aspect-bar-track"><div class="aspect-bar-fill" style="width:${scores[k] * 10}%;"></div></div>
              <span class="aspect-score">${scores[k]}/10</span>
            </div>`).join('')}
        </div>
      </div>`;
  }

  function renderStatic() {
    const c = counts(videos);
    const pct = (n) => (c.total ? (n / c.total) * 100 : 0);

    const heroImgSrc = car.posterImage || car.posterUrl;
    const heroPoster = heroImgSrc
      ? `<div class="hero-poster"><img src="${heroImgSrc}" alt="" style="width:100%; height:100%; object-fit:cover;"></div>`
      : `<div class="hero-poster" style="background:${car.posterGrad}">
          <svg viewBox="0 0 200 300">
            <circle cx="100" cy="130" r="70" fill="none" stroke="#ffffff" stroke-width="1"></circle>
            <circle cx="100" cy="130" r="46" fill="none" stroke="#ffffff" stroke-width="1"></circle>
            <circle cx="100" cy="130" r="22" fill="none" stroke="#ffffff" stroke-width="1"></circle>
          </svg>
          <span class="initial">${car.title.charAt(0)}</span>
        </div>`;

    const heroBlock = `
      <div class="hero">
        ${heroPoster}
        <div class="hero-info">
          <div>
            <div class="eyebrow">${car.brand} &middot; ${car.fuelType} &middot; Launched ${car.launchDate}</div>
            <h1 class="hero-title">${car.title}</h1>
            <p class="hero-synopsis">${car.synopsis} ${car.priceRange ? `Priced at ${car.priceRange}.` : ''} Aggregated from ${videos.length} reviewer videos${VIDEO_LANGS.length > 2 ? ' across ' + VIDEO_LANGS.slice(1).join(', ') + ' channels' : ''}.</p>
          </div>

          <div class="score-panel">
            <div>
              <div><span class="big">${car.score}</span><span class="score-suffix">/10</span></div>
              <div class="label">Aggregate score</div>
            </div>
            <div class="divider"></div>
            <div>
              <div class="verdict-row" style="margin-top:0"><span class="dot" style="width:9px;height:9px;background:${v.color}"></span><span style="font-size:15px; font-weight:600;">${v.label}</span></div>
              <div class="label" style="margin-top:4px;">Based on ${videos.length} reviews</div>
            </div>
          </div>

          <div class="spread-wrap">
            <span class="filter-label">Reviewer spread</span>
            <div class="spread-bar">
              <div style="width:${pct(c.positive)}%; background:#34d399;"></div>
              <div style="width:${pct(c.mixed)}%; background:#fbbf24;"></div>
              <div style="width:${pct(c.negative)}%; background:#f87171;"></div>
            </div>
            <span class="spread-legend">${c.positive} positive &middot; ${c.mixed} mixed &middot; ${c.negative} negative</span>
          </div>
        </div>
      </div>`;

    const bannerWrapped = car.bannerUrl
      ? `<div class="movie-banner" style="background-image:url('${car.bannerUrl}')">${heroBlock}</div>`
      : heroBlock;

    const brochureBlock = car.brochureUrl
      ? `<div class="summary-card" style="margin-top:24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
          <div>
            <span class="filter-label">Official Brochure</span>
            <p class="muted" style="margin-top:6px;">Full specs, variants, and official photography straight from the manufacturer.</p>
          </div>
          <a class="watch-link" href="${car.brochureUrl}" target="_blank" rel="noopener" style="flex-shrink:0;">Download Brochure ${externalIcon()}</a>
        </div>`
      : '';

    document.getElementById('content').innerHTML = `
      ${bannerWrapped}
      ${brochureBlock}
      ${renderAspects()}
      <div class="summary-card" style="margin-top:24px;">
        <span class="filter-label">The Verdict</span>
        <p class="summary-text">${car.summaryText || buildSummaryText(car, c)}</p>
        <div class="pc-grid">
          <div class="pc-col">
            <span class="filter-label">Pros</span>
            ${car.pros.map((p) => `<div class="pc-item">${checkIcon()}<span>${p}</span></div>`).join('')}
          </div>
          <div class="pc-col">
            <span class="filter-label">Cons</span>
            ${car.cons.map((c) => `<div class="pc-item">${crossIcon()}<span>${c}</span></div>`).join('')}
          </div>
        </div>
      </div>

      <div class="section-heading">
        <h2>Contributing reviews</h2>
        <span class="muted" id="results-label"></span>
      </div>
      <div class="filter-row">
        <span class="filter-label">Language</span>
        <div class="chip-row" id="lang-filter"></div>
      </div>
      <div class="video-grid" id="video-grid"></div>

      <div class="ai-disclaimer">
        Scores, summaries, and pros/cons on this page are generated by AI from publicly available YouTube review videos, for informational purposes only. No copyright infringement is intended &mdash; all video content, thumbnails, and imagery belong to their original creators and rights holders.
      </div>
    `;
  }

  function renderFilters() {
    const el = document.getElementById('lang-filter');
    el.innerHTML = '';
    VIDEO_LANGS.forEach((lang) => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (lang === filterLang ? ' active' : '');
      chip.textContent = lang;
      chip.onclick = () => { filterLang = lang; renderVideos(); };
      el.appendChild(chip);
    });
  }

  function renderVideos() {
    renderFilters();
    const list = filterLang === 'All' ? videos : videos.filter((x) => x.language === filterLang);
    document.getElementById('results-label').textContent = `${list.length} of ${videos.length} reviews`;
    document.getElementById('video-grid').innerHTML = list.map((x) => {
      const vv = CAR_VERDICTS[x.verdictKey];
      const initials = x.channel.split(' ').map((w) => w.charAt(0)).slice(0, 2).join('');
      return `
        <div class="video-card">
          <div class="channel-row">
            <div class="avatar" style="background:${x.avatarColor}">${initials}</div>
            <div>
              <div class="channel-name">${x.channel}</div>
              <div class="channel-lang">${x.language}</div>
            </div>
          </div>
          <div class="thumb" style="background:linear-gradient(135deg, ${x.avatarColor}, #1e1912)">
            <div class="play"><div class="play-btn">${/youtube\.com|youtu\.be/.test(x.url || '') ? playIcon() : docIcon()}</div></div>
          </div>
          <div class="video-meta-row">
            <span class="verdict-row" style="margin-top:0"><span class="dot" style="background:${vv.color}"></span><span class="verdict-label">${vv.label}</span></span>
            <span class="muted">${x.rating}</span>
          </div>
          <p class="video-quote">&ldquo;${x.quote}&rdquo;</p>
          <a class="watch-link" href="${(x.url || '#').replace(/"/g, '&quot;')}" target="_blank" rel="noopener">${/youtube\.com|youtu\.be/.test(x.url || '') ? 'Watch full review' : 'Read full review'} ${externalIcon()}</a>
        </div>`;
    }).join('');
  }

  renderStatic();
  renderVideos();
</script>
</body>
</html>
