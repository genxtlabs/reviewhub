<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewHub — Movie detail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="header-top">
      <div style="display:flex; align-items:baseline; gap:14px;">
        <span class="wordmark">ReviewHub</span>
        <span class="tagline">Reviews, aggregated.</span>
      </div>
    </div>
    <a class="back-link" href="index.html">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      All movies
    </a>
    <div class="rule"></div>
  </div>

  <div id="content"></div>
</div>

<script src="data.js"></script>
<script src="store.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const requested = getMovie(params.get('id'));

  if (!requested || requested.status !== 'published') {
    document.getElementById('content').innerHTML = `<div class="empty-state">This movie isn't published yet. <a href="index.html">Back to all movies</a></div>`;
    throw new Error('movie not published');
  }

  const movie = requested;
  const v = VERDICTS[movie.verdictKey];
  const videos = (movie.videos || []).filter((x) => x.verdictKey);

  const VIDEO_LANGS = ['All', ...Array.from(new Set(videos.map((x) => x.language)))];
  let filterLang = 'All';

  function checkIcon() {
    return `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#2f8f5b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  function crossIcon() {
    return `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4L12 12M12 4L4 12" stroke="#b3402f" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  }
  function playIcon() {
    return `<svg width="13" height="13" viewBox="0 0 16 16" fill="#262019"><path d="M4 2.5L13 8L4 13.5V2.5Z"/></svg>`;
  }
  function externalIcon() {
    return `<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M4 12L12 4M12 4H5M12 4V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function counts(list) {
    const positive = list.filter((x) => x.verdictKey === 'must' || x.verdictKey === 'good').length;
    const mixed = list.filter((x) => x.verdictKey === 'onetime').length;
    const negative = list.filter((x) => x.verdictKey === 'wait' || x.verdictKey === 'skip').length;
    return { positive, mixed, negative, total: list.length };
  }

  function renderStatic() {
    const c = counts(videos);
    const pct = (n) => (c.total ? (n / c.total) * 100 : 0);

    const heroPoster = movie.posterImage
      ? `<div class="hero-poster"><img src="${movie.posterImage}" alt="" style="width:100%; height:100%; object-fit:cover;"></div>`
      : `<div class="hero-poster" style="background:${movie.posterGrad}">
          <svg viewBox="0 0 200 300">
            <circle cx="100" cy="130" r="70" fill="none" stroke="#ffffff" stroke-width="1"></circle>
            <circle cx="100" cy="130" r="46" fill="none" stroke="#ffffff" stroke-width="1"></circle>
            <circle cx="100" cy="130" r="22" fill="none" stroke="#ffffff" stroke-width="1"></circle>
          </svg>
          <span class="initial">${movie.title.charAt(0)}</span>
        </div>`;

    document.getElementById('content').innerHTML = `
      <div class="hero">
        ${heroPoster}
        <div class="hero-info">
          <div>
            <div class="eyebrow">${movie.industry} &middot; ${movie.language} &middot; Released ${movie.releaseDate}</div>
            <h1 class="hero-title">${movie.title}</h1>
            <p class="hero-synopsis">${movie.synopsis} Aggregated from ${videos.length} reviewer videos${VIDEO_LANGS.length > 2 ? ' across ' + VIDEO_LANGS.slice(1).join(', ') + ' channels' : ''}.</p>
          </div>

          <div class="score-panel">
            <div>
              <div><span class="big">${movie.score}</span><span class="score-suffix">/10</span></div>
              <div class="label">Aggregate score</div>
            </div>
            <div class="divider"></div>
            <div>
              <div class="verdict-row" style="margin-top:0"><span class="dot" style="width:9px;height:9px;background:${v.color}"></span><span style="font-size:15px; font-weight:600;">${v.label}</span></div>
              <div class="label" style="margin-top:4px;">Based on ${videos.length} reviews</div>
            </div>
          </div>

          <div class="spread-wrap">
            <span class="filter-label">Reviewer spread</span>
            <div class="spread-bar">
              <div style="width:${pct(c.positive)}%; background:#2f8f5b;"></div>
              <div style="width:${pct(c.mixed)}%; background:#c98a1c;"></div>
              <div style="width:${pct(c.negative)}%; background:#b3402f;"></div>
            </div>
            <span class="spread-legend">${c.positive} positive &middot; ${c.mixed} mixed &middot; ${c.negative} negative</span>
          </div>
        </div>
      </div>

      <div class="summary-card">
        <span class="filter-label">The Verdict</span>
        <p class="summary-text">${movie.summaryText || buildSummaryText(movie, c)}</p>
        <div class="pc-grid">
          <div class="pc-col">
            <span class="filter-label">Pros</span>
            ${movie.pros.map((p) => `<div class="pc-item">${checkIcon()}<span>${p}</span></div>`).join('')}
          </div>
          <div class="pc-col">
            <span class="filter-label">Cons</span>
            ${movie.cons.map((c) => `<div class="pc-item">${crossIcon()}<span>${c}</span></div>`).join('')}
          </div>
        </div>
      </div>

      <div class="section-heading">
        <h2>Contributing reviews</h2>
        <span class="muted" id="results-label"></span>
      </div>
      <div class="filter-row">
        <span class="filter-label">Language</span>
        <div class="chip-row" id="lang-filter"></div>
      </div>
      <div class="video-grid" id="video-grid"></div>
    `;
  }

  function renderFilters() {
    const el = document.getElementById('lang-filter');
    el.innerHTML = '';
    VIDEO_LANGS.forEach((lang) => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (lang === filterLang ? ' active' : '');
      chip.textContent = lang;
      chip.onclick = () => { filterLang = lang; renderVideos(); };
      el.appendChild(chip);
    });
  }

  function renderVideos() {
    renderFilters();
    const list = filterLang === 'All' ? videos : videos.filter((x) => x.language === filterLang);
    document.getElementById('results-label').textContent = `${list.length} of ${videos.length} reviews`;
    document.getElementById('video-grid').innerHTML = list.map((x) => {
      const vv = VERDICTS[x.verdictKey];
      const initials = x.channel.split(' ').map((w) => w.charAt(0)).slice(0, 2).join('');
      return `
        <div class="video-card">
          <div class="channel-row">
            <div class="avatar" style="background:${x.avatarColor}">${initials}</div>
            <div>
              <div class="channel-name">${x.channel}</div>
              <div class="channel-lang">${x.language}</div>
            </div>
          </div>
          <div class="thumb" style="background:linear-gradient(135deg, ${x.avatarColor}, #1a1410)">
            <div class="play"><div class="play-btn">${playIcon()}</div></div>
          </div>
          <div class="video-meta-row">
            <span class="verdict-row" style="margin-top:0"><span class="dot" style="background:${vv.color}"></span><span class="verdict-label">${vv.label}</span></span>
            <span class="muted">${x.rating}</span>
          </div>
          <p class="video-quote">&ldquo;${x.quote}&rdquo;</p>
          <a class="watch-link" href="${(x.url || '#').replace(/"/g, '&quot;')}" target="_blank" rel="noopener">Watch full review ${externalIcon()}</a>
        </div>`;
    }).join('');
  }

  renderStatic();
  renderVideos();
</script>
</body>
</html>
